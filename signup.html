<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | The 360° Youth Leader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topnav">
    <div class="brand">The 360° Youth Leader</div>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="about.html">About</a>
      <a class="nav-link" href="journey.html">Journey</a>
      <a class="nav-link" href="contact.html">Contact</a>
      <a class="nav-link" href="signup.html">Sign Up</a>
    </div>
  </div>

  <div class="container">
    <div class="hero">
      <h1>Sign Up</h1>
      <div class="sub">Tell us a bit about your child and we’ll connect with you about the next steps.</div>
    </div>

    <div class="section form-section">
      <a class="back" href="index.html">← Back to home</a>
      <form class="signup-form">
        <fieldset>
          <legend>Parent / Guardian Details</legend>
          <div class="form-row"><label>Full Name</label><input type="text" placeholder="Your full name" /></div>
          <div class="form-row"><label>Email</label><input type="email" placeholder="you@example.com" /></div>
          <div class="form-row"><label>Phone</label><input type="text" placeholder="(555) 123-4567" /></div>
        </fieldset>

        <fieldset>
          <legend>Student Details</legend>
          <div class="form-row"><label>Student Name</label><input type="text" placeholder="Student full name" /></div>
          <div class="form-grid">
            <div class="form-row"><label>Age</label><input type="text" placeholder="e.g. 13" /></div>
            <div class="form-row"><label>Grade</label><input type="text" placeholder="e.g. 8" /></div>
          </div>
          <div class="form-row"><label>Interests / goals</label><textarea placeholder="Tell us what matters most to your child, and what kind of support they need."></textarea></div>
        </fieldset>

        <div class="form-actions">
          <button class="btn" type="submit">Submit Interest</button>
          <a class="btn secondary" href="contact.html">Ask a Question</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
